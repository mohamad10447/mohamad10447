<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <style>
      .term-text { font-family: 'Courier New', Courier, monospace; font-size: 13px; fill: #00ff66; }
      .prompt { fill: #3DDC84; font-weight: bold; }
      .command { fill: #ffffff; }
      .comment { fill: #888888; }
      .frida { fill: #ff4747; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Terminal Window Base -->
  <rect width="400" height="300" rx="8" fill="#0d1117" stroke="#3DDC84" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />

  <!-- Background Android Ghost Logo -->
  <g opacity="0.05" transform="translate(130, 70) scale(1.5)">
     <path d="M 10 50 A 40 40 0 0 1 90 50 Z" fill="#3DDC84" />
     <line x1="25" y1="15" x2="35" y2="25" stroke="#3DDC84" stroke-width="4" stroke-linecap="round"/>
     <line x1="75" y1="15" x2="65" y2="25" stroke="#3DDC84" stroke-width="4" stroke-linecap="round"/>
     <circle cx="35" cy="40" r="4" fill="#0d1117" />
     <circle cx="65" cy="40" r="4" fill="#0d1117" />
  </g>

  <!-- Terminal Text -->
  <text x="20" y="60" class="term-text prompt">root@beirut:~$ <tspan class="command">adb shell</tspan></text>
  <text x="20" y="85" class="term-text">marlin:/ # <tspan class="command">su</tspan></text>
  <text x="20" y="110" class="term-text">marlin:/ # <tspan class="command">frida-server &amp;</tspan></text>
  <text x="20" y="135" class="term-text">[1] <tspan class="command">1337</tspan></text>
  <text x="20" y="160" class="term-text">marlin:/ # <tspan class="command">exit</tspan></text>
  <text x="20" y="185" class="term-text prompt">root@beirut:~$ <tspan class="command">frida -U -l bypass.js -f app.apk</tspan></text>
  
  <!-- Frida ASCII Art -->
  <text x="20" y="215" class="term-text frida">     ____</text>
  <text x="20" y="230" class="term-text frida">    / _  |   <tspan class="comment">Frida - Dynamic instrumentation</tspan></text>
  <text x="20" y="245" class="term-text frida">   | (_| |   <tspan class="command">[+] Spawning `app.apk`...</tspan></text>
  <text x="20" y="260" class="term-text frida">    > _  |   <tspan class="command">[+] Hooking SSLContext...</tspan></text>
  <text x="20" y="275" class="term-text frida">   /_/ |_|   <tspan class="command">[+] Bypass active. Intercepting.</tspan></text>
</svg>

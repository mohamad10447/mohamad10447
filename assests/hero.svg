<svg width="900" height="820" viewBox="0 0 900 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d0d0d; }
      .term-box { fill: #0a0a0a; stroke: #3DDC84; stroke-width: 1; stroke-opacity: 0.25; }
      .titlebar { fill: #111111; }

      .btn-r { fill: #ff5f57; }
      .btn-y { fill: #febc2e; }
      .btn-g { fill: #28c840; }

      text { font-family: 'JetBrains Mono', 'Courier New', monospace; }

      .term-label { font-size: 11px; fill: #555; }
      .ssh        { font-size: 10px; fill: #3DDC84; opacity: 0.55; }

      .p-root { font-size: 13px; font-weight: bold; fill: #3DDC84; }
      .p-at   { font-size: 13px; fill: #444; }
      .p-host { font-size: 13px; font-weight: bold; fill: #79c0ff; }
      .p-path { font-size: 13px; fill: #cc99ff; }
      .p-hash { font-size: 13px; font-weight: bold; fill: #3DDC84; }
      .p-cmd  { font-size: 13px; fill: #fff; }
      .p-flag { font-size: 13px; fill: #febc2e; }
      .p-file { font-size: 13px; fill: #f97316; }

      .big-name { font-size: 74px; font-weight: bold; fill: #3DDC84; }
      .glitch-a { font-size: 74px; font-weight: bold; fill: #00ffcc; opacity: 0;
        animation: g1 7s 3.5s infinite; clip-path: inset(0 0 60% 0); }
      .glitch-b { font-size: 74px; font-weight: bold; fill: #ff6ac1; opacity: 0;
        animation: g2 7s 3.6s infinite; clip-path: inset(62% 0 0 0); }
      @keyframes g1 {
        0%,90%,100%{transform:none;opacity:0}
        91%{transform:translate(-5px,2px);opacity:.7}
        92%{transform:translate(5px,-2px);opacity:.7}
        93%{transform:translate(-3px,4px);opacity:.7}
        94%{transform:none;opacity:0}
      }
      @keyframes g2 {
        0%,90%,100%{transform:none;opacity:0}
        91%{transform:translate(5px,-2px);opacity:.5}
        92%{transform:translate(-5px,2px);opacity:.5}
        93%{transform:translate(3px,-4px);opacity:.5}
        94%{transform:none;opacity:0}
      }

      .nick   { font-size: 16px; font-weight: bold; fill: #79c0ff; letter-spacing: 5px; }
      .nick-at{ fill: #3DDC84; }

      .role-text { font-size: 12px; fill: #3DDC84; letter-spacing: 2px; }
      .dot { fill: #3DDC84; animation: bd 1.4s ease-in-out infinite; }
      @keyframes bd { 0%,100%{opacity:1} 50%{opacity:.1} }

      .cursor { fill: #3DDC84; animation: bc 1s step-end infinite; }
      @keyframes bc { 0%,100%{opacity:1} 50%{opacity:0} }

      .sec-label { font-size: 10px; fill: #3DDC84; letter-spacing: 4px; opacity: 0.7; }
      .div-line  { stroke: #3DDC84; stroke-width: 0.5; stroke-opacity: 0.2; }

      .jk { font-size: 12px; fill: #79c0ff; }
      .jc { font-size: 12px; fill: #555; }
      .js { font-size: 12px; fill: #f97316; }
      .jg { font-size: 12px; fill: #3DDC84; }
      .jb { font-size: 12px; fill: #555; }

      .kt-kw  { font-size: 12px; fill: #cc99ff; }
      .kt-cn  { font-size: 12px; fill: #79c0ff; }
      .kt-str { font-size: 12px; fill: #f9c74f; }
      .kt-val { font-size: 12px; fill: #3DDC84; }
      .kt-pun { font-size: 12px; fill: #666; }

      .pill-bg   { fill: #3DDC84; fill-opacity: 0.07; stroke: #3DDC84; stroke-width: 1; stroke-opacity: 0.25; }
      .pill-name { font-size: 11px; font-weight: bold; fill: #fff; letter-spacing: 1px; }
      .pill-star { font-size: 10px; fill: #3DDC84; letter-spacing: 1px; }

      .phi-box { fill: #3DDC84; fill-opacity: 0.03; stroke: #3DDC84; stroke-width: 1; stroke-opacity: 0.18; }
      .phi-q   { font-size: 13px; font-style: italic; fill: #fff; }
      .phi-rule{ font-size: 11.5px; fill: #8892a4; }
      .phi-dot { font-size: 11.5px; fill: #3DDC84; }

      .build-item { font-size: 12px; fill: #8892a4; }
      .build-dot  { font-size: 12px; fill: #3DDC84; }
      .build-empty{ font-size: 12px; fill: #444; }

      .prog-bg   { fill: #ffffff; fill-opacity: 0.05; }
      .prog-fill { fill: url(#progGrad); }
      .prog-label{ font-size: 11px; fill: #8892a4; }
      .prog-pct  { font-size: 11px; fill: #3DDC84; font-weight: bold; }

      .sweep { animation: sw 4s linear infinite; }
      @keyframes sw { 0%{transform:translateX(-900px)} 100%{transform:translateX(900px)} }

      /* sequential reveal */
      .r0  { opacity:0; animation: ap .05s .3s forwards; }
      .r1  { opacity:0; animation: ap .05s .9s forwards; }
      .r2  { opacity:0; animation: ap .05s 1.4s forwards; }
      .r3  { opacity:0; animation: ap .05s 1.8s forwards; }
      .r4  { opacity:0; animation: ap .05s 2.3s forwards; }
      .r5  { opacity:0; animation: ap .05s 2.7s forwards; }
      .r6  { opacity:0; animation: ap .05s 3.1s forwards; }
      .r7  { opacity:0; animation: ap .05s 3.5s forwards; }
      .r8  { opacity:0; animation: ap .05s 3.9s forwards; }
      .r9  { opacity:0; animation: ap .05s 4.3s forwards; }
      .r10 { opacity:0; animation: ap .05s 4.7s forwards; }
      .r11 { opacity:0; animation: ap .05s 5.1s forwards; }
      @keyframes ap { to { opacity:1; } }

      .fade-in { opacity:0; animation: fadeIn 1s .2s ease forwards; }
      @keyframes fadeIn { to { opacity:1; } }
    </style>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sglow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="progGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5c3a"/>
      <stop offset="100%" stop-color="#3DDC84"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#3DDC84" stroke-width="0.4" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- BG -->
  <rect width="900" height="820" class="bg"/>
  <rect width="900" height="820" fill="url(#grid)"/>

  <!-- TERMINAL WINDOW -->
  <g class="fade-in">
    <rect x="20" y="16" width="860" height="788" rx="14" class="term-box"/>

    <!-- titlebar -->
    <rect x="20" y="16" width="860" height="44" rx="14" class="titlebar"/>
    <rect x="20" y="44" width="860" height="16" class="titlebar"/>
    <rect x="20" y="59" width="860" height="1" fill="#fff" opacity="0.05"/>

    <circle cx="48" cy="38" r="6" class="btn-r" filter="url(#sglow)"/>
    <circle cx="68" cy="38" r="6" class="btn-y" filter="url(#sglow)"/>
    <circle cx="88" cy="38" r="6" class="btn-g" filter="url(#sglow)"/>

    <text x="450" y="43" text-anchor="middle" class="term-label">bash — zsh — 80×24</text>
    <text x="856" y="43" text-anchor="end" class="ssh">SSH ●</text>

    <!-- sweep scanline -->
    <line class="sweep" x1="0" y1="60" x2="900" y2="60" stroke="#3DDC84" stroke-width="1" opacity="0.35"/>

    <!-- ════════════════════════════════ -->
    <!-- SECTION 1 — HERO               -->
    <!-- ════════════════════════════════ -->

    <!-- prompt line 1 -->
    <g class="r0">
      <text x="40" y="98">
        <tspan class="p-root">root</tspan><tspan class="p-at">@</tspan><tspan class="p-host">github</tspan><tspan class="p-at">:</tspan><tspan class="p-path">~/profile</tspan><tspan class="p-hash">  #  </tspan><tspan class="p-cmd">whoami </tspan><tspan class="p-flag">--verbose</tspan>
      </text>
    </g>

    <!-- BIG NAME -->
    <g class="r1">
      <text x="40" y="188" class="glitch-a">MOHAMAD</text>
      <text x="40" y="188" class="glitch-b">MOHAMAD</text>
      <text x="40" y="188" class="big-name" filter="url(#glow)">MOHAMAD</text>
    </g>

    <!-- nickname -->
    <g class="r2">
      <text x="40" y="214" class="nick"><tspan class="nick-at">@</tspan>M_One</text>
    </g>

    <!-- role pill -->
    <g class="r3">
      <rect x="40" y="225" width="216" height="28" rx="6" class="pill-bg"/>
      <circle cx="57" cy="239" r="4" class="dot" filter="url(#sglow)"/>
      <text x="69" y="243" class="role-text">Android Developer</text>
    </g>

    <!-- divider -->
    <g class="r3">
      <line x1="40" y1="268" x2="860" y2="268" class="div-line"/>
      <text x="450" y="264" text-anchor="middle" class="sec-label">◈  CAT IDENTITY.JSON  ◈</text>
    </g>

    <!-- ════════════════════════════════ -->
    <!-- SECTION 2 — WHOAMI / IDENTITY  -->
    <!-- ════════════════════════════════ -->

    <g class="r4">
      <text x="40" y="294">
        <tspan class="p-root">root</tspan><tspan class="p-at">@</tspan><tspan class="p-host">github</tspan><tspan class="p-at">:</tspan><tspan class="p-path">~/profile</tspan><tspan class="p-hash">  #  </tspan><tspan class="p-cmd">cat </tspan><tspan class="p-file">identity.json</tspan>
      </text>
    </g>

    <g class="r5">
      <text x="40"  y="314" class="jb">{</text>
      <text x="56"  y="332"><tspan class="jk">"name"</tspan><tspan class="jc">:     </tspan><tspan class="js">"Mohamad"</tspan><tspan class="jc">,</tspan></text>
      <text x="56"  y="350"><tspan class="jk">"alias"</tspan><tspan class="jc">:    </tspan><tspan class="js">"M_One"</tspan><tspan class="jc">,</tspan></text>
      <text x="56"  y="368"><tspan class="jk">"role"</tspan><tspan class="jc">:     </tspan><tspan class="js">"Android Developer"</tspan><tspan class="jc">,</tspan></text>
      <text x="56"  y="386"><tspan class="jk">"focus"</tspan><tspan class="jc">:    </tspan><tspan class="js">"Native · Kotlin · Compose"</tspan><tspan class="jc">,</tspan></text>
      <text x="56"  y="404"><tspan class="jk">"motto"</tspan><tspan class="jc">:    </tspan><tspan class="jg">"Write code that survives the test of time."</tspan><tspan class="jc">,</tspan></text>
      <text x="56"  y="422"><tspan class="jk">"status"</tspan><tspan class="jc">:   </tspan><tspan class="jg">"🟢 Building in production"</tspan></text>
      <text x="40"  y="440" class="jb">}</text>
    </g>

    <!-- divider -->
    <g class="r5">
      <line x1="40" y1="460" x2="860" y2="460" class="div-line"/>
      <text x="450" y="456" text-anchor="middle" class="sec-label">◈  TECH STACK  ◈</text>
    </g>

    <!-- ════════════════════════════════ -->
    <!-- SECTION 3 — STACK PILLS        -->
    <!-- ════════════════════════════════ -->

    <g class="r6">
      <!-- pill 1 -->
      <rect x="40"  y="470" width="190" height="32" rx="8" class="pill-bg"/>
      <text x="55"  y="491" class="pill-name">Kotlin</text>
      <text x="178" y="491" class="pill-star">★★★★★</text>

      <!-- pill 2 -->
      <rect x="244" y="470" width="190" height="32" rx="8" class="pill-bg"/>
      <text x="259" y="491" class="pill-name">Jetpack Compose</text>
      <text x="382" y="491" class="pill-star">★★★★★</text>

      <!-- pill 3 -->
      <rect x="448" y="470" width="190" height="32" rx="8" class="pill-bg"/>
      <text x="463" y="491" class="pill-name">Coroutines + Flow</text>
      <text x="586" y="491" class="pill-star">★★★★★</text>

      <!-- pill 4 -->
      <rect x="652" y="470" width="190" height="32" rx="8" class="pill-bg"/>
      <text x="667" y="491" class="pill-name">Clean Arch</text>
      <text x="782" y="491" class="pill-star">★★★★★</text>
    </g>

    <g class="r7">
      <!-- pill 5 -->
      <rect x="40"  y="512" width="190" height="32" rx="8" class="pill-bg"/>
      <text x="55"  y="533" class="pill-name">Room / DataStore</text>
      <text x="178" y="533" class="pill-star">★★★★☆</text>

      <!-- pill 6 -->
      <rect x="244" y="512" width="190" height="32" rx="8" class="pill-bg"/>
      <text x="259" y="533" class="pill-name">Hilt / Koin</text>
      <text x="382" y="533" class="pill-star">★★★★☆</text>

      <!-- pill 7 -->
      <rect x="448" y="512" width="190" height="32" rx="8" class="pill-bg"/>
      <text x="463" y="533" class="pill-name">KMP</text>
      <text x="586" y="533" class="pill-star">★★★☆☆</text>

      <!-- pill 8 -->
      <rect x="652" y="512" width="190" height="32" rx="8" class="pill-bg"/>
      <text x="667" y="533" class="pill-name">Git / CI</text>
      <text x="782" y="533" class="pill-star">★★★★☆</text>
    </g>

    <!-- divider -->
    <g class="r7">
      <line x1="40" y1="560" x2="860" y2="560" class="div-line"/>
      <text x="450" y="556" text-anchor="middle" class="sec-label">◈  PHILOSOPHY  ◈</text>
    </g>

    <!-- ════════════════════════════════ -->
    <!-- SECTION 4 — PHILOSOPHY         -->
    <!-- ════════════════════════════════ -->

    <g class="r8">
      <rect x="40" y="568" width="820" height="118" rx="10" class="phi-box"/>

      <!-- big quote mark -->
      <text x="56" y="620" font-size="80" fill="#3DDC84" opacity="0.06" font-family="Georgia,serif">"</text>

      <text x="60" y="594" class="phi-q">"Clean Architecture isn't a template — it's a discipline."</text>

      <text x="60" y="618"><tspan class="phi-dot">✦  </tspan><tspan class="phi-rule">UI layer stays dumb. Logic lives in ViewModels.</tspan></text>
      <text x="60" y="636"><tspan class="phi-dot">✦  </tspan><tspan class="phi-rule">Repositories own the data, not Activities.</tspan></text>
      <text x="60" y="654"><tspan class="phi-dot">✦  </tspan><tspan class="phi-rule">Every coroutine has a scope. Every scope has a reason.</tspan></text>
      <text x="60" y="672"><tspan class="phi-dot">✦  </tspan><tspan class="phi-rule">If it's hard to test, it's hard to trust.</tspan></text>
    </g>

    <!-- divider -->
    <g class="r8">
      <line x1="40" y1="702" x2="860" y2="702" class="div-line"/>
      <text x="450" y="698" text-anchor="middle" class="sec-label">◈  BUILD STATUS  ◈</text>
    </g>

    <!-- ════════════════════════════════ -->
    <!-- SECTION 5 — BUILD STATUS       -->
    <!-- ════════════════════════════════ -->

    <g class="r9">
      <!-- prompt -->
      <text x="40" y="724">
        <tspan class="p-root">root</tspan><tspan class="p-at">@</tspan><tspan class="p-host">github</tspan><tspan class="p-at">:</tspan><tspan class="p-path">~/profile</tspan><tspan class="p-hash">  #  </tspan><tspan class="p-cmd">./build </tspan><tspan class="p-flag">--status</tspan>
      </text>

      <!-- progress bar label -->
      <text x="40" y="744" class="prog-label">BUILD IN PROGRESS</text>
      <text x="860" y="744" text-anchor="end" class="prog-pct">87%</text>

      <!-- bar track -->
      <rect x="40" y="750" width="820" height="6" rx="3" class="prog-bg"/>
      <!-- bar fill -->
      <rect x="40" y="750" width="713" height="6" rx="3" class="prog-fill" filter="url(#sglow)"/>
    </g>

    <g class="r10">
      <text x="40" y="776"><tspan class="build-dot">◉  </tspan><tspan class="build-item">Scalable Android apps with offline-first architecture</tspan></text>
      <text x="40" y="793"><tspan class="build-dot">◉  </tspan><tspan class="build-item">Compose UI systems that feel alive and responsive</tspan></text>
      <text x="460" y="776"><tspan class="build-dot">◉  </tspan><tspan class="build-item">Kotlin Multiplatform exploration</tspan></text>
      <text x="460" y="793"><tspan class="build-empty">◎  </tspan><tspan class="build-item">Next: Contributing to open source Android tooling</tspan></text>
    </g>

    <!-- final prompt + cursor -->
    <g class="r11">
      <text x="40" y="812">
        <tspan class="p-root">root</tspan><tspan class="p-at">@</tspan><tspan class="p-host">github</tspan><tspan class="p-at">:</tspan><tspan class="p-path">~/profile</tspan><tspan class="p-hash">  #  </tspan>
      </text>
      <rect x="208" y="798" width="10" height="16" class="cursor" filter="url(#sglow)"/>
    </g>

  </g>
</svg>
